<!doctype html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMMER CITY SS2 - GuideBook แนะนำผู้เล่นใหม่</title>
    <meta name="description" content="คู่มือผู้เล่นใหม่ SUMMER CITY SS2 — งานฟาร์ม ราคากลาง ผลไม้ปีศาจ แฟชั่น อาหาร ไอเทม และเวลากิจกรรม">
    <meta name="theme-color" content="#0a0806">
    <meta property="og:type" content="website">
    <meta property="og:title" content="SUMMER CITY SS2 — Guide Book">
    <meta property="og:description" content="คู่มือผู้เล่นใหม่: งานฟาร์ม ราคากลาง ผลไม้ปีศาจ แฟชั่น อาหาร ไอเทม และเวลากิจกรรม">
    <meta property="og:image" content="summer-city-evening.webp">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preload" as="image" href="summer-city-evening.webp" type="image/webp" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;900&family=Orbitron:wght@700;900&display=swap">
    <!-- กันหน้าเปล่าไม่มีสไตล์โผล่ตอน F5: ซ่อนเนื้อหาไว้จนกว่า CSS จริงจะโหลด (base.css สั่งให้แสดง) ระหว่างรอโชว์รูปพื้นหลัง
         ห้ามใส่ background ที่ html — จะทำให้พื้นของ body บังรูป .bg-scene -->
    <style>body { visibility: hidden; background: #0a0806 url('/summer-city-evening.webp') center / cover no-repeat fixed; }</style>
    <noscript><style>body { visibility: visible; }</style></noscript>
</head>
<body>
    <div class="bg-scene" aria-hidden="true"></div>

    <!-- คัทซีน: อินโทรตอนเปิดเว็บ + คั่นตอนเปลี่ยนหมวด (คลุมจอตั้งแต่ paint แรก) -->
    <div id="cutscene" class="cutscene is-active is-intro" aria-hidden="true">
        <div class="cutscene__logo">
            <img id="cutscene-logo" alt="" hidden>
            <div class="cutscene__bar"></div>
        </div>
        <div class="cutscene__intro">
            <div class="intro-title" id="intro-title">
                <span class="intro-title__base"><b>SUMMER</b> CITY SS2</span>
                <span class="intro-title__fill" aria-hidden="true"><b>SUMMER</b> CITY SS2</span>
            </div>
            <div class="intro-count" id="intro-count">000</div>
        </div>
    </div>

    <!-- แถบบนสุด: โลโก้ (กดพระอาทิตย์ = เข้าสู่ระบบแอดมิน) + หมวด + ปุ่มด้านขวา
         จอกว้างอยู่บรรทัดเดียว / จอแคบเป็น 2 แถว (มือถือพับแถวบนตอนเลื่อนลง) -->
    <header class="appbar" id="appbar">
        <div class="appbar__inner">
            <div class="brand">
                <button type="button" class="sun-btn" id="admin-login-btn" aria-label="เข้าสู่ระบบแอดมิน">
                    <i class="fa-solid fa-sun" aria-hidden="true"></i>
                </button>
                <a href="#home" class="brand__text" id="brand-link">
                    <strong><span class="text-gradient">SUMMER CITY</span> SS2</strong>
                    <small>Guide Book ผู้เล่นใหม่</small>
                </a>
            </div>
            <nav class="tabs" id="tabbar" aria-label="หมวดหมู่">
                <div class="tabs__list" id="tabbar-list"></div>
            </nav>
            <div class="appbar__actions">
                <button type="button" class="icon-btn" id="sound-toggle" aria-label="ปิดเสียง"></button>
                <a class="discord-btn" id="discord-link" target="_blank" rel="noopener" aria-label="เข้าร่วมดิสคอร์ด" title="เข้าร่วมดิสคอร์ด"><i class="fa-brands fa-discord" aria-hidden="true"></i></a>
                <button type="button" class="mail-btn" id="mail-btn" aria-label="ประกาศจากทีมงาน"><i class="fa-solid fa-envelope"></i></button>
                <a class="creator" id="creator-link" target="_blank" rel="noopener" aria-label="ผู้จัดทำ: JOSEPH (Facebook)">
                    <img src="creator-avatar.png" alt="" class="creator__avatar">
                    <span class="creator__text"><small>Created By</small><b>JOSEPH</b></span>
                </a>
                <div class="admin-bar" id="admin-bar" hidden>
                    <span class="admin-bar__who"><b id="admin-name"></b><small class="role-badge">ADMIN</small></span>
                    <button type="button" class="icon-btn" id="logo-edit-btn" aria-label="ตั้งรูปโลโก้คัทซีน"><i class="fa-solid fa-image"></i></button>
                    <button type="button" class="icon-btn icon-btn--danger" id="logout-btn" aria-label="ออกจากระบบ"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>
        </div>
    </header>

    <main class="main" id="main">
        <section class="panel" id="panel-home" data-tab="home"></section>
        <section class="panel" id="panel-farm" data-tab="farm" hidden></section>
        <section class="panel" id="panel-food" data-tab="food" hidden></section>
        <section class="panel" id="panel-devil" data-tab="devil" hidden></section>
        <section class="panel" id="panel-rune" data-tab="rune" hidden></section>
        <section class="panel" id="panel-fashion" data-tab="fashion" hidden></section>
        <section class="panel" id="panel-items" data-tab="items" hidden></section>
        <section class="panel" id="panel-events" data-tab="events" hidden></section>
        <section class="panel" id="panel-gkey" data-tab="gkey" hidden></section>
    </main>

    <footer class="footer">
        <div class="footer__bottom">
            <span>© <span id="footer-year">2026</span> SUMMER CITY SS2 · Guide Book</span>
            <span>Created by JOSEPH</span>
        </div>
    </footer>

    <button type="button" class="float-cart" id="float-cart" aria-label="เปิดร้านค้า GACHA"><i class="fa-solid fa-cart-shopping"></i></button>

    <noscript><p class="noscript">กรุณาเปิด JavaScript เพื่อใช้งาน Guide Book</p></noscript>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
